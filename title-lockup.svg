<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" width="1240" height="360" role="img" aria-labelledby="t d">
  <title id="t">Re.从零开始的野蛮生长 life</title>
  <desc id="d">Re:Zero 风格的紫罗兰 Re. 与白描边发光黑体中文；下方 LIFE 字标里的 I 用胶囊替代，右侧接英文副标。</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1D161A"/>
      <stop offset="0.55" stop-color="#0D0A0C"/>
      <stop offset="1" stop-color="#080708"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.2" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#3E2833" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#3E2833" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="0.92" cy="1" r="0.85">
      <stop offset="0" stop-color="#232C42" stop-opacity="0.75"/>
      <stop offset="0.65" stop-color="#232C42" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="reGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#DACFF8"/>
      <stop offset="0.5" stop-color="#A392E0"/>
      <stop offset="1" stop-color="#7A66C6"/>
    </linearGradient>
    <linearGradient id="cnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#544945"/>
      <stop offset="0.4" stop-color="#1A1514"/>
      <stop offset="1" stop-color="#0A0808"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7EBAE8"/>
      <stop offset="1" stop-color="#3C82C2"/>
    </linearGradient>

    <clipPath id="capClip">
      <rect x="-18" y="-39" width="36" height="78" rx="18"/>
    </clipPath>

    <filter id="glowRe" filterUnits="userSpaceOnUse" x="-70" y="-90" width="340" height="340">
      <feGaussianBlur stdDeviation="4" result="a"/>
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCn" filterUnits="userSpaceOnUse" x="110" y="-100" width="1150" height="340">
      <feGaussianBlur stdDeviation="5" result="a"/>
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chipShadow" filterUnits="userSpaceOnUse" x="-40" y="-24" width="320" height="160">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1240" height="360" rx="26" fill="url(#plate)"/>
  <rect width="1240" height="360" rx="26" fill="url(#vig)"/>
  <rect width="1240" height="360" rx="26" fill="url(#vig2)"/>
  <rect x="0.5" y="0.5" width="1239" height="359" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <g transform="translate(54,10)">

    <!-- 主行：Re. + 中文 -->
    <text x="10" y="138" fill="url(#reGrad)" stroke="#F7F3EF" stroke-width="3" paint-order="stroke"
          font-family="Georgia,'Times New Roman',serif" font-size="118" letter-spacing="-2"
          filter="url(#glowRe)">Re.</text>

    <text x="210" y="138" fill="url(#cnGrad)" stroke="#FFFFFF" stroke-width="7" paint-order="stroke"
          font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei UI','Microsoft YaHei','PingFang SC',sans-serif"
          font-weight="900" font-size="102" filter="url(#glowCn)">从零开始的野蛮生长</text>

    <!-- 底行左：LIFE 胶囊字标 -->
    <g transform="translate(0,196)">
      <rect x="0" y="0" width="230" height="94" rx="16" fill="#FBF7F1" filter="url(#chipShadow)"/>

      <text x="22" y="71" fill="#14100F" font-family="'Arial Black','Archivo Black','Microsoft YaHei UI',sans-serif"
            font-weight="900" font-size="66">L</text>

      <g transform="translate(94,47) rotate(-8)">
        <g clip-path="url(#capClip)">
          <rect x="-18" y="-39" width="36" height="39" fill="url(#blueGrad)"/>
          <rect x="-18" y="0" width="36" height="39" fill="#F7F5F2"/>
        </g>
        <circle cx="-1" cy="-26" r="3.6" fill="#FFFFFF"/>
        <rect x="-3.4" y="-19" width="6.8" height="15" rx="3.4" fill="#FFFFFF"/>
        <rect x="-18" y="-39" width="36" height="78" rx="18" fill="none" stroke="#111111" stroke-width="5.5"/>
      </g>

      <text x="122" y="71" fill="#14100F" font-family="'Arial Black','Archivo Black','Microsoft YaHei UI',sans-serif"
            font-weight="900" font-size="66">F</text>
      <text x="164" y="71" fill="#14100F" font-family="'Arial Black','Archivo Black','Microsoft YaHei UI',sans-serif"
            font-weight="900" font-size="66">E</text>
    </g>

    <!-- 底行右：细线 + 菱形 + 英文副标 -->
    <line x1="262" y1="244" x2="646" y2="244" stroke="#B9ABE4" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M660 238 L666 244 L660 250 L654 244 Z" fill="#A392E0" fill-opacity="0.9"/>

    <text x="1132" y="251" text-anchor="end" fill="#CFC7C0" fill-opacity="0.85"
          font-family="'Helvetica Neue',Arial,'Microsoft YaHei UI',sans-serif"
          font-size="21" font-weight="600" letter-spacing="3.2">A LIFE GROWING WILD FROM ZERO</text>
  </g>
</svg>
